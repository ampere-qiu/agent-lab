INHERIT: mkdocs.yml
site_description: 日英のAI Agent Lab教材。基礎、ツール、smolagents、マルチエージェント調査、画像・ブラウザ実習を学びます。
docs_dir: docs-ja
site_dir: site/ja
theme:
  language: ja
  palette:
  - scheme: default
    primary: deep purple
    accent: deep purple
    toggle:
      icon: material/weather-night
      name: ダークモードに切り替え
  - scheme: slate
    primary: deep purple
    accent: deep purple
    toggle:
      icon: material/weather-sunny
      name: ライトモードに切り替え
plugins:
- search:
    lang: ja
copyright: SI Labの学生向けにAmpereが作成 · 原典：Hugging Face
nav:
- はじめに: index.md
- 第1週 · 基礎とダミーエージェント:
  - 第1週の学習計画: week-1-learning-plan.md
  - 始める前に: before-you-start.md
  - 01 · 基礎と小テスト: unit-1-walkthrough.md
  - 02 · ローカル環境の準備: prepare-your-computer.md
  - 03 · ダミーエージェント: dummy-agent-local.md
- 第2週 · テンプレートとツール:
  - 第2週の学習計画: week-2-learning-plan.md
  - 04 · テンプレートを動かす: run-your-first-agent.md
  - 05 · 仕組みを理解する: understand-the-template.md
  - 06 · ツールの登録とテスト: first-agent-practical.md
  - 07 · 学習の完了確認: quizzes.md
- 第03週 · smolagents:
  - 第03週 · 学習計画とダウンロード: week-3-learning-plan.md
  - 08 · smolagents入門: week-3-framework.md
  - 09 · CodeAgentを動かす: week-3-code-agent.md
  - 10 · Pythonコードと構造化ツール呼び出し: week-3-action-formats.md
  - 11 · 関数とクラスで作るツール: week-3-custom-tool.md
  - 12 · Agentic RAGシステムを作る（任意）: week-3-retrieval.md
  - 13 · 完了確認: week-3-completion.md
- 第04週 · smolagents Part 2:
  - 第04週 · 学習計画とダウンロード: week-4-preview.md
  - 14 · 第03週のRAG理解度チェック: week-4-retrieval.md
  - 15 · マルチエージェントシステム: week-4-batman.md
  - 16 · 画像・ブラウザエージェント: week-4-vision-browser.md
  - 17 · 完了確認: week-4-completion.md
- 第05週 · LlamaIndex:
  - 第05週 · 学習計画と準備: week-5-learning-plan.md
  - 18 · LlamaIndex入門: week-5-introduction.md
  - 19 · LlamaHubの連携機能: week-5-llamahub.md
  - 20 · コンポーネントとRAG: week-5-components.md
  - 21 · LlamaIndexのツール: week-5-tools.md
  - 小テスト1 · コンポーネントとツール: week-5-quiz-1.md
  - 22 · LlamaIndexのエージェント: week-5-agents.md
  - 23 · イベントで処理をつなぐ: week-5-workflows.md
  - 小テスト2 · エージェントとワークフロー: week-5-quiz-2.md
  - 第05週 · まとめと完了確認: week-5-completion.md
- 参考:
  - コース全体の流れ: course-route.md
markdown_extensions:
- admonition
- attr_list
- md_in_html
- pymdownx.details
- pymdownx.superfences
- pymdownx.highlight:
    anchor_linenums: true
- toc:
    permalink: true
    toc_depth: 2-3
    permalink_title: この見出しへのリンク
