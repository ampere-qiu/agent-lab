site_name: Agent Lab
site_description: 'Bilingual AI Agent Lab: foundations, tools, smolagents, multi-agent
  research and vision/browser exercises.'
docs_dir: docs
site_dir: site
theme:
  name: material
  language: en
  font: false
  icon:
    logo: material/robot-outline
  palette:
  - scheme: default
    primary: deep purple
    accent: deep purple
    toggle:
      icon: material/weather-night
      name: Switch to dark mode
  - scheme: slate
    primary: deep purple
    accent: deep purple
    toggle:
      icon: material/weather-sunny
      name: Switch to light mode
  features:
  - navigation.sections
  - navigation.expand
  - navigation.footer
  - navigation.top
  - toc.follow
  - search.suggest
  - search.highlight
  - content.code.copy
  custom_dir: overrides
plugins:
- search
markdown_extensions:
- admonition
- attr_list
- md_in_html
- pymdownx.details
- pymdownx.superfences
- pymdownx.highlight:
    anchor_linenums: true
- toc:
    permalink: true
    toc_depth: 2-3
extra_css:
- stylesheets/extra.css
copyright: Created by Ampere for SI Lab students · Original course by Hugging Face
