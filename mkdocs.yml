site_name: Agent Lab
site_description: 'Learn AI agents locally with Groq: foundations, a working template,
  and Week 03 smolagents exercises.'
docs_dir: docs
site_dir: site
theme:
  name: material
  language: en
  font: false
  icon:
    logo: material/robot-outline
  palette:
  - scheme: default
    primary: deep purple
    accent: deep purple
    toggle:
      icon: material/weather-night
      name: Switch to dark mode
  - scheme: slate
    primary: deep purple
    accent: deep purple
    toggle:
      icon: material/weather-sunny
      name: Switch to light mode
  features:
  - navigation.sections
  - navigation.expand
  - navigation.footer
  - navigation.top
  - toc.follow
  - search.suggest
  - search.highlight
  - content.code.copy
  custom_dir: overrides
plugins:
- search
markdown_extensions:
- admonition
- attr_list
- md_in_html
- pymdownx.details
- pymdownx.superfences
- pymdownx.highlight:
    anchor_linenums: true
- toc:
    permalink: true
    toc_depth: 2-3
extra_css:
- stylesheets/extra.css
copyright: Created by Ampere for SI Lab students · Original course by Hugging Face
nav:
- Start here: index.md
- Week 1 · Concepts & dummy agent:
  - Week 1 plan: week-1-learning-plan.md
  - Before you start: before-you-start.md
  - 01 · Agent foundations & quizzes: unit-1-walkthrough.md
  - 02 · Local setup: prepare-your-computer.md
  - 03 · Dummy agent: dummy-agent-local.md
- Week 2 · Working template & tools:
  - Week 2 plan: week-2-learning-plan.md
  - 04 · Run the template: run-your-first-agent.md
  - 05 · Understand the template: understand-the-template.md
  - 06 · Enable & test tools: first-agent-practical.md
  - 07 · Completion checks: quizzes.md
- Week 03 · smolagents:
  - Week 03 · Plan and download: week-3-learning-plan.md
  - 08 · Introduction to smolagents: week-3-framework.md
  - 09 · Run a CodeAgent: week-3-code-agent.md
  - 10 · Python or structured tool calls?: week-3-action-formats.md
  - '11 · Tools: functions and classes': week-3-custom-tool.md
  - 12 · Completion checks: week-3-completion.md
- Week 04 · Coming next: week-4-preview.md
- Reference:
  - Course route: course-route.md
hooks:
- hooks/bilingual.py
extra_javascript:
- javascripts/language.js
extra:
  alternate: true
  english_only_pages: []
